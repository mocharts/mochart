name: Audit

# Scheduled rather than part of CI: a new advisory published against a
# transitive dependency would otherwise fail every open PR for a reason none of
# them introduced. This reports on its own cadence, and can be run on demand.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The contributor pin; CI's matrix covers the supported range instead.
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: an audit needs the tree resolved, not the packages built
      - run: npm ci --ignore-scripts
      # --omit=dev: only production dependencies fail the job; an advisory against a
      # dev-only tool never reaches a published package or a built site.
      - run: npm audit --omit=dev --audit-level=high
      # dev dependencies still reported, without failing the job
      - run: npm audit --audit-level=high || true
