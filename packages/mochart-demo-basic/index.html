<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mochart demos</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>mochart</h1>
        <div id="demo-list"></div>
      </aside>
      <main id="content">
        <div id="toolbar">
          <span id="demo-title"></span>
          <span class="spacer"></span>
          <button id="randomize" title="Generate new random values for every series">Randomize</button>
          <button id="add-category" title="Append a new category to the chart">+ Category</button>
          <button id="remove-category" title="Remove the last category from the chart">&minus; Category</button>
          <button id="autoplay" title="Keep randomizing the values on an interval">Play</button>
          <button id="reset" title="Restore the demo's original data">Reset</button>
          <button id="export-png" title="Download the chart as a PNG image">PNG</button>
          <button id="export-svg" title="Download the chart as an SVG image">SVG</button>
        </div>
        <div id="chart-host"></div>
        <pre id="errors" hidden></pre>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
