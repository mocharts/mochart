<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mochart ESM example</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        #chart { width: 640px; height: 360px; }
        button { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>mochart — ES module example</h1>
    <p>Uses the imperative <code>createChart</code> API. Serve this directory over HTTP (ES modules do not load from <code>file://</code>).</p>
    <button id="randomize">Randomize</button>
    <div id="chart"></div>
    <script type="module">
        import { createChart, enhanceConfig, ArrayOfObjectsDataProvider } from '../dist/mochart.js';

        const config = {
            version: '1.0.0',
            title: { text: 'Fruit' },
            categoryAxis: {
                property: 'name',
                type: 'string',
                scale: 'ordinal'
            },
            valueAxes: [
                { id: 'va', min: 0 }
            ],
            series: [
                { axis: 'va', property: 'weight', title: 'Weight', renderer: 'bar' },
                { axis: 'va', property: 'price', title: 'Price', renderer: 'line' }
            ]
        };

        let data = [
            { name: 'Apple', weight: 10, price: 5 },
            { name: 'Orange', weight: 6, price: 7 },
            { name: 'Banana', weight: 8, price: 3 }
        ];

        const mochartConfig = enhanceConfig(config);

        const chart = createChart(document.getElementById('chart'), {
            mochartConfig,
            dataProvider: new ArrayOfObjectsDataProvider(data),
            width: 640,
            height: 360
        });

        document.getElementById('randomize').addEventListener('click', () => {
            data = data.map((row) => ({
                ...row,
                weight: Math.round(Math.random() * 12),
                price: Math.round(Math.random() * 12)
            }));
            chart.update({ dataProvider: new ArrayOfObjectsDataProvider(data) });
        });
    </script>
</body>
</html>
