<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mochart sparkline preset example</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        button { margin-bottom: 1rem; }
        table { border-collapse: collapse; }
        th, td { text-align: left; padding: 0.4rem 1.25rem 0.4rem 0; border-bottom: 1px solid #ddd; }
        td.value { font-variant-numeric: tabular-nums; text-align: right; }
        .spark { display: inline-block; width: 150px; height: 32px; vertical-align: middle; }
    </style>
</head>
<body>
    <h1>mochart — sparkline preset</h1>
    <p>Tiny inline charts via <code>createSparklineConfig</code>: a regular chart config with the
       axes, legend, tooltip, crosshairs and point markers switched off and margins collapsed.
       Serve this directory over HTTP.</p>
    <button id="randomize">Randomize</button>
    <table>
        <thead>
            <tr><th>Metric</th><th>Latest</th><th>Last 30 days</th></tr>
        </thead>
        <tbody id="rows"></tbody>
    </table>
    <script type="module">
        import { createChart, enhanceConfig, ArrayOfObjectsDataProvider, createSparklineConfig } from '../dist/mochart.js';

        // Deterministic pseudo-random walk so reloads look the same.
        let state = 11;
        const next = () => {
            state = (state * 1664525 + 1013904223) % 4294967296;
            return state / 4294967296;
        };
        const walk = (start, step, count = 30) => {
            let value = start;
            return Array.from({ length: count }, (_, i) => {
                value = Math.max(0, value + (next() - 0.48) * step);
                return { i, value: Math.round(value * 10) / 10 };
            });
        };
        const winLoss = (count = 30) =>
            Array.from({ length: count }, (_, i) => {
                const win = next() > 0.45;
                return { i: String(i), up: win ? 1 : undefined, down: win ? undefined : -1 };
            });

        const singleSeries = (renderer, color) => ({
            version: '1.0.0',
            categoryAxis: { property: 'i', type: 'number', scale: 'linear' },
            valueAxes: [{ id: 'va' }],
            series: [{ axis: 'va', property: 'value', renderer, shapeStyle: { normal: { strokeColor: color, fillColor: color } } }]
        });

        // Win/loss reuses the waterfall trick: one property (and color) per
        // direction, each row filling exactly one of them.
        const winLossConfig = {
            version: '1.0.0',
            categoryAxis: { property: 'i', type: 'string', scale: 'ordinal' },
            valueAxes: [{ id: 'va', base: 0, min: -1, max: 1 }],
            series: [
                { axis: 'va', property: 'up', renderer: 'bar', missingValueMode: 'connect', shapeStyle: { normal: { fillColor: '#1baf7a' } } },
                { axis: 'va', property: 'down', renderer: 'bar', missingValueMode: 'connect', shapeStyle: { normal: { fillColor: '#e34948' } } }
            ]
        };

        const metrics = [
            { label: 'Revenue ($k)', config: singleSeries('line', '#2a78d6'), generate: () => walk(120, 14) },
            { label: 'Sessions (k)', config: singleSeries('area', '#1baf7a'), generate: () => walk(46, 7) },
            { label: 'P95 latency (ms)', config: singleSeries('line', '#e34948'), generate: () => walk(220, 30) },
            { label: 'Daily win/loss', config: winLossConfig, generate: winLoss }
        ];

        const rowsEl = document.getElementById('rows');
        for (const metric of metrics) {
            const row = document.createElement('tr');
            row.innerHTML = `<td>${metric.label}</td><td class="value"></td><td><span class="spark"></span></td>`;
            rowsEl.appendChild(row);
            metric.valueEl = row.querySelector('.value');
            metric.chartEl = row.querySelector('.spark');
            metric.chart = null;
        }

        function latestText(metric, data) {
            const last = data[data.length - 1];
            if (last.value !== undefined) {
                return String(last.value);
            }
            const wins = data.filter((row) => row.up !== undefined).length;
            return `${wins}W / ${data.length - wins}L`;
        }

        function render() {
            for (const metric of metrics) {
                const data = metric.generate();
                const mochartConfig = enhanceConfig(createSparklineConfig(metric.config));
                const dataProvider = new ArrayOfObjectsDataProvider(data);
                metric.valueEl.textContent = latestText(metric, data);
                if (metric.chart === null) {
                    metric.chart = createChart(metric.chartEl, { mochartConfig, dataProvider, width: 150, height: 32 });
                } else {
                    metric.chart.update({ dataProvider });
                }
            }
        }

        document.getElementById('randomize').addEventListener('click', render);

        render();
    </script>
</body>
</html>
