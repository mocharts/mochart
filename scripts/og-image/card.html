<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mochart social preview card</title>
  <link rel="stylesheet" href="/packages/mochart/css/mochart.css">
  <style>
    html, body { margin: 0; background: #ffffff; color: #1f2328; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      width: 1200px; height: 630px;
      display: flex; align-items: center; gap: 48px;
      padding: 0 56px; box-sizing: border-box;
    }
    .intro { flex: 0 0 440px; display: flex; flex-direction: column; }
    .mark { width: 72px; height: 72px; display: block; }
    .name { margin: 28px 0 0; font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; }
    .text { margin: 20px 0 0; font-size: 30px; font-weight: 600; line-height: 1.25; color: #3e63dd; }
    .site { margin: 36px 0 0; font-size: 28px; font-weight: 500; color: #1f2328; }
    .panel {
      flex: 1; height: 470px;
      background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 16px;
      box-sizing: border-box; padding: 20px;
    }
    #chart { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="intro">
    <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
      <rect width="16" height="16" rx="3" fill="#3e63dd"/>
      <rect x="3" y="9" width="2.5" height="4" fill="#fff"/>
      <rect x="6.75" y="6" width="2.5" height="7" fill="#fff"/>
      <rect x="10.5" y="3" width="2.5" height="10" fill="#fff"/>
    </svg>
    <h1 class="name">mochart</h1>
    <p class="text">Animated interactive SVG charts</p>
    <p class="site">mochart.org</p>
  </div>
  <div class="panel"><div id="chart"></div></div>
  <script type="module">
    import { createChart, enhanceConfig, ArrayOfObjectsDataProvider } from '/packages/mochart/dist/mochart.js';
    import { scenes } from '../readme-gif/scenes.mjs';

    // The stacked README scene, held still on the state its recording settles at.
    const { title: _title, ...config } = scenes.stacked.config('light');
    const data = scenes.stacked.settledData;

    const element = document.getElementById('chart');
    await document.fonts.ready;
    createChart(element, {
      mochartConfig: enhanceConfig(config),
      dataProvider: new ArrayOfObjectsDataProvider(data),
      width: element.clientWidth,
      height: element.clientHeight
    });
    // Let the mount animation finish before the capture screenshots the page.
    await new Promise((resolve) => setTimeout(resolve, config.animation.initialDuration + 300));
    window.__cardReady = true;
  </script>
</body>
</html>
